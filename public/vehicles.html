<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Vehicles — Pace Car Rental</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="main-nav"></nav>

<div class="container">
    <h1>Available Vehicles</h1>
    <p class="subtitle">Pick a vehicle, choose your dates, and book instantly.</p>

    <label for="category-filter" style="max-width:220px;">Filter by category</label>
    <select id="category-filter" style="max-width:220px;">
        <option value="">All categories</option>
        <option value="sedan">Sedan</option>
        <option value="hatchback">Hatchback</option>
        <option value="bakkie">Bakkie / Pickup</option>
        <option value="suv">SUV</option>
    </select>

    <div class="grid" id="vehicle-grid" style="margin-top:20px;">
        <p class="muted">Loading vehicles...</p>
    </div>
</div>

<!-- Booking modal -->
<div class="modal-backdrop hidden" id="booking-modal">
    <div class="modal">
        <h2 id="booking-vehicle-name">Book Vehicle</h2>
        <form id="booking-form">
            <label>Start Date</label>
            <input type="date" id="booking-start" required>
            <label>End Date</label>
            <input type="date" id="booking-end" required>
            <p class="muted" id="booking-estimate"></p>
            <button class="btn" type="submit">Confirm Booking</button>
            <button class="btn secondary" type="button" onclick="closeModal()">Cancel</button>
            <div class="error-msg hidden" id="booking-error"></div>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/vehicles.js"></script>
</body>
</html>
