<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pace Car Rental — Vehicle Rental Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-slideshow">
    <div></div>
    <div></div>
    <div></div>
    <div></div>
</div>
<div class="bg-overlay"></div>
<nav id="main-nav"></nav>

<div class="container">
    <h1>Pace Car Rental</h1>
    <p class="subtitle">Book a vehicle in minutes. Manage bookings, payments and returns all in one place.</p>

    <div class="card">
        <p>Pace Car Rental's Vehicle Rental Management System (VRMS) centralizes bookings, vehicles,
        payments, returns, maintenance and reporting — no more spreadsheets, no more double-bookings.</p>
        <a href="vehicles.html"><button class="btn">Browse Available Vehicles</button></a>
    </div>

    <div class="card" id="login" style="max-width:420px;">
        <div class="tabs">
            <button id="tab-login" class="active" onclick="showTab('login')">Log In</button>
            <button id="tab-register" onclick="showTab('register')">Register</button>
        </div>

        <form id="login-form">
            <label>Email</label>
            <input type="email" id="login-email" required>
            <label>Password</label>
            <input type="password" id="login-password" required>
            <button class="btn" type="submit">Log In</button>
            <div class="error-msg hidden" id="login-error"></div>
        </form>

        <form id="register-form" class="hidden">
            <label>Full Name</label>
            <input type="text" id="reg-name" required>
            <label>Email</label>
            <input type="email" id="reg-email" required>
            <label>Phone</label>
            <input type="text" id="reg-phone">
            <label>Password</label>
            <input type="password" id="reg-password" required minlength="6">
            <button class="btn" type="submit">Create Account</button>
            <div class="error-msg hidden" id="register-error"></div>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
