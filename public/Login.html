<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Pace Car Rental</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-slideshow">
    <div></div>
    <div></div>
    <div></div>
    <div></div>
</div>
<div class="bg-overlay"></div>
<nav id="main-nav"></nav>

<div class="container">
    <h1>Welcome to Pace Car Rental</h1>
    <p class="subtitle">Log in or create an account to book your vehicle.</p>

    <div class="card" id="login" style="max-width:420px;">
        <div class="tabs">
            <button id="tab-login" class="active" onclick="showTab('login')">Log In</button>
            <button id="tab-register" onclick="showTab('register')">Register</button>
        </div>

        <form id="login-form">
            <label>Email</label>
            <input type="email" id="login-email" required>
            <label>Password</label>
            <input type="password" id="login-password" required>
            <button class="btn" type="submit">Log In</button>
            <div class="error-msg hidden" id="login-error"></div>
        </form>

        <form id="register-form" class="hidden">
            <label>Full Name</label>
            <input type="text" id="reg-name" required>
            <label>Email</label>
            <input type="email" id="reg-email" required>
            <label>Phone</label>
            <input type="text" id="reg-phone">
            <label>Password</label>
            <input type="password" id="reg-password" required minlength="6">
            <button class="btn" type="submit">Create Account</button>
            <div class="error-msg hidden" id="register-error"></div>
        </form>
    </div>
    <p><a href="index.html" style="color:#ffd25e;">&larr; Back to browsing vehicles</a></p>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
